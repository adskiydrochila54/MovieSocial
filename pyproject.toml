[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["*/migrations/*", ".venv", "staticfiles"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
source = ["core", "users", "movies", "reviews", "news", "direct_messages"]
omit = ["*/migrations/*", "*/tests.py", "manage.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 75
